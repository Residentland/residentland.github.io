<footer class="site-footer">
  <div class="copper" aria-hidden="true"></div>
  <div class="wrap footer-row">
    <div>
      <p class="footer-brand">{{ site.Title }}</p>
      <p class="dim">{{ site.Params.tagline }}</p>
    </div>
    <ul class="footer-links">
      <li><a href="{{ site.Params.pouet }}">Pouet ↗</a></li>
      <li><a href="{{ site.Params.demozoo }}">Demozoo ↗</a></li>
      {{ with site.GetPage "/news" }}{{ with .OutputFormats.Get "rss" }}<li><a href="{{ .RelPermalink }}">RSS</a></li>{{ end }}{{ end }}
    </ul>
  </div>
  <p class="wrap footer-note">© 2002–{{ now.Year }} Resident · long live the scene</p>
</footer>
